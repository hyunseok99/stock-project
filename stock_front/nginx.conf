server {
    listen 80;
    server_name localhost;

    # Vite base 경로인 /stock/에 맞춰 설정
    location /stock/ {
        root /usr/share/nginx/html;
        index index.html;
        # 하위 경로에서도 index.html을 찾을 수 있도록 수정
        try_files $uri $uri/ /stock/index.html;
    }

    # 에러 페이지 설정 (선택 사항)
    error_page 500 502 503 504 /50x.html;
}