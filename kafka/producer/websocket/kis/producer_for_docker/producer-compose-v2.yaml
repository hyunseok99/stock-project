services:
    producer1:
      build: .
      container_name: producer_1
      env_file:
        - ./env/producer1_config.env
      networks:
        - kafka-set_default
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"
      deploy:
        resources:
          limits:
            memory: 128M # 무료 인스턴스 보호를 위한 메모리 제한
      restart: always

    producer2:
      build: .
      container_name: producer_2
      env_file:
        - ./env/producer2_config.env
      networks:
        - kafka-set_default
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"
      deploy:
        resources:
          limits:
            memory: 128M # 무료 인스턴스 보호를 위한 메모리 제한
      restart: always

networks:
  kafka-set_default:
    external: true