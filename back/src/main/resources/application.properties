# =====================================================================
# MariaDB 연결 및 K3s 환경 변수 주입 설정 + 커넥션 풀
# =====================================================================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8mb4
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# MariaDB의 경우 멀티쓰레드 가능 풀 사이즈 10
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# JPA / Hibernate 설정
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.mvc.converters.preferred-json-mapper=gson
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.security.user.name=admin
spring.security.user.password=admin1234

# Kafka 설정
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}

# Redis 설정
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

#spring.jpa.hibernate.ddl-auto=update
#read only
#spring.jpa.hibernate.ddl-auto=none
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.show-sql=true

# tracking api, tomcat internal thread & connection pool
management.metrics.distribution.percentiles-histogram.http.server.requests=true
server.tomcat.mbeanregistry.enabled=true
management.endpoints.web.exposure.include=prometheus

