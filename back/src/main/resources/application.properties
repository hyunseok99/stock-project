spring.application.name=sol_server
server.port=8090

spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# SQLite WAL 모드   1.배포 2.로컬
#spring.datasource.url=jdbc:sqlite:/app/data/livestock.db?journal_mode=WAL
spring.datasource.url=jdbc:sqlite:D:/Stock_oracle_instance/db/livestock.db?journal_mode=WAL

# SQLite pool, timeout setting
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=10000

#logging.level.org.springframework.security=DEBUG

spring.mvc.converters.preferred-json-mapper=gson
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.security.user.name=admin
spring.security.user.password=admin1234

#spring.jpa.hibernate.ddl-auto=update
#read only
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

