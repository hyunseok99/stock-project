plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.team4'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // spring boot starter
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // security & monitoring
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Dev Tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'



    // Test Dependency
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
//    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
//    implementation 'org.hibernate.orm:hibernate-community-dialects:7.1.3.Final'


    // hibernate - sqlite 공식 지원 안해서 넣었던 것 - 2개
//    implementation 'org.hibernate.orm:hibernate-community-dialects:6.6.18.Final'
//    implementation 'org.hibernate.orm:hibernate-core:6.6.31.Final'


    // DB
//    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
//    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
//    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
//    runtimeOnly 'org.xerial:sqlite-jdbc:3.50.3.0'
//    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
//    runtimeOnly 'com.h2database:h2'
//    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // authenticate
//    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
//    implementation "io.jsonwebtoken:jjwt:0.9.1"

    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
//    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.2'

//    // com.sun.xml.bind
//    implementation 'com.sun.xml.bind:jaxb-impl:4.0.1'
//    implementation 'com.sun.xml.bind:jaxb-core:4.0.1'

}

tasks.named('test') {
    useJUnitPlatform()
}
